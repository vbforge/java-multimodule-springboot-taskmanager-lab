# Scenario 3: Everything in Docker
server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/taskdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: taskuser
    password: taskpass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

logging:
  level:
    root: WARN
    com.vbforge.mysql_docker: INFO
    org.hibernate.SQL: WARN