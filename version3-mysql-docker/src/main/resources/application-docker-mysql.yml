# Scenario 2: Local App + MySQL in Docker
server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/taskdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: taskuser
    password: taskpass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

logging:
  level:
    com.vbforge.mysql_docker: DEBUG
    org.hibernate.SQL: DEBUG