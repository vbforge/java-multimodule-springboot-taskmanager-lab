# Base configuration - just activate profile
# Uncomment the profile you want to use:

# Scenario 1: Everything local
# spring.profiles.active=local

# Scenario 2: App local, MySQL in Docker
# spring.profiles.active=docker-mysql

# Scenario 3: Everything in Docker
# spring.profiles.active=docker-both

# Default (if no profile specified)
spring.profiles.active=local

